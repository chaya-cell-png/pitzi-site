<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // GitHub Pages מגיש את העמוד הזה בכל כתובת שגויה, גם עמוק בתוך תיקיות.
    // לכן קובעים בסיס כדי שהקישורים לקבצי האתר לא יישברו.
    (function () {
      if (location.protocol === 'file:') return;
      var seg = location.pathname.split('/')[1];
      var base = /\.github\.io$/.test(location.hostname) && seg && seg.indexOf('.') === -1 ? '/' + seg + '/' : '/';
      document.write('<base href="' + base + '">');
    })();
  </script>
  <title>העמוד אבד | לחץ כאן ואל תלחץ כאן</title>
